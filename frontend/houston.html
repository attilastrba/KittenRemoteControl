<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Houston — Kitten Remote Control</title>
<link rel="stylesheet" href="houston.css">
</head>
<body>
  <header>
    <h1>Kitten Remote Control</h1>
    <div class="sub">MISSION READOUT · TELEMACHUS DATALINK</div>
  </header>

  <div class="config">
    <label>Host <input id="host" value="localhost" spellcheck="false"></label>
    <label>Port <input id="port" class="small" value="8085"></label>
    <label>Rate(ms) <input id="rate" class="small" value="500"></label>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">OFFLINE</span></div>
  </div>

  <div class="stack">
    <div class="gauge"><span class="screw-l"></span><span class="screw-r"></span>
      <div class="label">Apoapsis</div>
      <div class="readout" data-gauge="apoapsis"></div>
    </div>
    <div class="gauge"><span class="screw-l"></span><span class="screw-r"></span>
      <div class="label">Periapsis</div>
      <div class="readout" data-gauge="periapsis"></div>
    </div>
    <div class="gauge"><span class="screw-l"></span><span class="screw-r"></span>
      <div class="label">Altitude</div>
      <div class="readout" data-gauge="altitude"></div>
    </div>
  </div>

  <footer>
    <div id="ver">version —</div>
    <div id="err"></div>
  </footer>

  <script src="houston.js"></script>
</body>
</html>
